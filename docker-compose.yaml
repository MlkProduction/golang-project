services:

  # Описываем отдельный сервис (контейнер) PostgreSQL
  todoapp-postgres:

    # Docker-образ, из которого будет создан контейнер
    image: postgres:18.6-bookworm

    # Понятное имя контейнера
    container_name: todoapp-env-postgres

    # Переменные окружения для настройки PostgreSQL
    environment:

      # Имя пользователя БД
      - POSTGRES_USER=${POSTGRES_USER}

      # Пароль пользователя БД
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

      # Имя базы данных, которая будет создана
      - POSTGRES_DB=${POSTGRES_DB}

    # Подключаем папку на компьютере к папке с данными PostgreSQL
    # Благодаря этому данные не пропадут при пересоздании контейнера
    volumes:

      # ${PROJECT_ROOT} берётся из .env
      # /out/pgdata — место хранения данных на компьютере
      # /var/lib/postgresql — место хранения данных внутри контейнера
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql

    # Автоматически перезапускать контейнер, если он остановился
    restart: always

  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: todoapp-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todoapp-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"